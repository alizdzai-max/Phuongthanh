:root {
  --pink:#ff86b0;
  --pink2:#ffb7cf;
  --pink3:#ffe2ed;
  --pink4:#fff5f9;
  --deep:#b94370;
  --text:#9d4568;
  --white:#fffdfd;
  --shadow:0 12px 35px rgba(224,105,146,.16);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:'Baloo 2','Trebuchet MS',sans-serif;
  background:
    linear-gradient(90deg,rgba(255,255,255,.38) 50%,transparent 50%) 0 0/42px 42px,
    linear-gradient(rgba(255,255,255,.38) 50%,transparent 50%) 0 0/42px 42px,
    #ffdce8;
  overflow-x:hidden;
}
body:before, body:after{
  content:"";
  position:fixed;
  z-index:-1;
  border-radius:50%;
  filter:blur(2px);
  opacity:.55;
}
body:before{width:240px;height:240px;left:-100px;top:80px;background:#ffc2d6}
body:after{width:280px;height:280px;right:-130px;bottom:80px;background:#fff0f6}

.page{
  width:min(100%,760px);
  margin:auto;
  padding:18px 14px 35px;
}
.hero{
  position:relative;
  padding-bottom:74px;
}

.cover:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 12% 18%,rgba(255,255,255,.7) 0 4px,transparent 5px),
    radial-gradient(circle at 85% 25%,rgba(255,255,255,.7) 0 3px,transparent 4px),
    linear-gradient(110deg,transparent 20%,rgba(255,255,255,.16) 50%,transparent 80%);
  pointer-events:none;
}
.avatar-wrap{
  position:absolute;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:164px;
  height:164px;
  border-radius:50%;
  padding:7px;
  background:linear-gradient(145deg,#fff,#ffc0d6);
  box-shadow:0 8px 26px rgba(205,72,120,.22);
  z-index:3;
}
.avatar{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  border-radius:50%;
  border:5px solid #fff;
  display:block;
}
.avatar-wrap:before{
  content:"♡";
  position:absolute;
  right:-6px;
  top:4px;
  width:34px;height:34px;
  display:grid;place-items:center;
  color:#fff;
  background:#ff8fb6;
  border:4px solid #fff;
  border-radius:50%;
  font-size:20px;
  z-index:4;
}
.name{
  text-align:center;
  margin:17px 0 3px;
  font-family:'Fredoka','Baloo 2',sans-serif;
  font-size:clamp(38px,9vw,62px);
  line-height:1;
  font-weight:700;
  letter-spacing:-1.5px;
  color:#ff6fa0;
  text-shadow:
    3px 3px 0 #fff,
    -1px -1px 0 #fff,
    0 6px 15px rgba(255,111,160,.18);
}
.name .heart{font-size:.55em;vertical-align:middle;color:#ff86b0}
.tagline{
  width:max-content;
  max-width:92%;
  margin:10px auto 0;
  padding:7px 24px;
  border:2px solid #ffc0d4;
  border-radius:999px;
  background:rgba(255,255,255,.75);
  font-size:18px;
  font-weight:700;
  letter-spacing:1px;
  color:#dc6c98;
  box-shadow:0 5px 18px rgba(214,96,139,.08);
}
.links{
  margin-top:20px;
  display:grid;
  gap:11px;
}
.card{
  position:relative;
  display:flex;
  align-items:center;
  gap:14px;
  min-height:78px;
  padding:11px 15px 11px 13px;
  text-decoration:none;
  color:inherit;
  background:rgba(255,250,253,.9);
  border:2px solid #ffd2e1;
  border-radius:22px;
  box-shadow:0 7px 20px rgba(206,88,132,.08);
  transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  overflow:hidden;
}
.card:before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(255,182,207,.14),transparent 60%);
  pointer-events:none;
}
.card:hover{transform:translateY(-3px) scale(1.005);box-shadow:0 12px 25px rgba(206,88,132,.15);border-color:#ffb4cc}
.icon{
  width:58px;height:58px;min-width:58px;
  border-radius:17px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,#ff77a5,#ffb1ca);
  color:white;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.4),0 5px 10px rgba(230,95,140,.15);
}
.icon svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.icon .letter{font-family:Arial,sans-serif;font-size:29px;font-weight:800}
.card:nth-child(2) .icon{background:linear-gradient(145deg,#ff78a7,#ffc46f)}
.card:nth-child(3) .icon{background:linear-gradient(145deg,#181818,#4d4d4d)}
.card:nth-child(4) .icon{background:linear-gradient(145deg,#ffb72f,#ffd866);color:#8f5a00}
.card:nth-child(5) .icon{background:linear-gradient(145deg,#ff77a8,#ffabc7)}
.info{min-width:0;flex:1}
.title{font-family:'Fredoka','Baloo 2',sans-serif;font-size:21px;font-weight:700;color:#a94169;line-height:1.1}
.url{font-size:17px;color:#db759b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.arrow{
  font-size:35px;
  color:#ee7da6;
  line-height:1;
  margin-right:2px;
}
.share{
  width:100%;
  border:0;
  margin-top:20px;
  padding:15px 20px;
  border-radius:999px;
  color:white;
  font-family:'Fredoka','Baloo 2',sans-serif;
  font-size:21px;
  font-weight:700;
  letter-spacing:.3px;
  cursor:pointer;
  background:linear-gradient(90deg,#ff79a8,#ff9fc0,#ff79a8);
  box-shadow:0 8px 20px rgba(231,95,142,.25);
  transition:transform .2s ease;
}
.share:hover{transform:translateY(-2px)}
.share span{font-size:24px;margin-right:8px}
.footer{text-align:center;margin:18px 0 0;font-size:15px;color:#d7799d}
.deco{position:fixed;pointer-events:none;z-index:10;color:#ff8db2;opacity:.7;font-size:22px;animation:float 4s ease-in-out infinite}
.d1{top:8%;left:6%} .d2{top:23%;right:7%;animation-delay:1s} .d3{top:55%;left:3%;animation-delay:2s} .d4{bottom:12%;right:5%;animation-delay:.5s} .d5{top:39%;right:2%;font-size:15px}
@keyframes float{50%{transform:translateY(-9px) rotate(8deg)}}
@media(max-width:520px){
  .page{padding:10px 10px 25px}
  .cover{height:174px;border-radius:26px}
  .avatar-wrap{width:142px;height:142px}
  .hero{padding-bottom:65px}
  .name{font-size:42px;margin-top:14px}
  .tagline{font-size:16px;padding:6px 18px}
  .card{min-height:72px;border-radius:19px;gap:11px}
  .icon{width:52px;height:52px;min-width:52px;border-radius:15px}
  .icon svg{width:29px;height:29px}
  .title{font-size:19px}
  .url{font-size:15px}
  .arrow{font-size:31px}
}

.music-player{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:20;
}

.music-player button{
  width:54px;
  height:54px;
  border:3px solid #fff;
  border-radius:50%;
  background:linear-gradient(145deg,#ff79a8,#ffb1ca);
  color:white;
  font-size:24px;
  cursor:pointer;
  box-shadow:0 7px 20px rgba(206,88,132,.22);
}

.music-player button.playing{
  animation:musicSpin 3s linear infinite;
}

@keyframes musicSpin{
  to{transform:rotate(360deg)}
}

#youtubePlayer{
  position:absolute;
  width:1px;
  height:1px;
  opacity:0;
  pointer-events:none;
  border:0;
}
  
</style>
